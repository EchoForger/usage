<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Haonan · Usage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-actions">
  <button id="export-page-button" class="lang-toggle" type="button" data-i18n="exportPage"></button>
  <button id="export-button" class="lang-toggle" type="button" data-i18n="export"></button>
  <button id="lang-toggle" class="lang-toggle" type="button" data-i18n="toggle">EN</button>
</div>
<main>
  <header>
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 id="model-name">Haonan</h1>
    <p class="lede" id="lede"></p>
    <div class="pills">
      <span class="pill"><span data-i18n="size"></span> · <b id="pill-size">—</b></span>
      <span class="pill"><span data-i18n="effort"></span> · <b id="pill-effort">—</b></span>
      <span class="pill"><span data-i18n="context"></span> · <b id="pill-context">—</b></span>
    </div>
    <p class="muted small updated" id="updated-text"></p>
  </header>

  <section>
    <h2 data-i18n="limitsTitle"></h2>
    <p class="muted" data-i18n="limitsDesc"></p>
    <div class="card">
      <div class="limit">
        <div class="row"><span class="title" data-i18n="dailyLimit"></span></div>
        <div class="row muted"><span id="reset-text">—</span><span id="left-pct">—</span></div>
        <div class="bar-hit" id="left-hit"><div class="bar"><div id="left-bar"></div></div></div>
        <div class="row muted small"><span id="left-tokens">—</span><span id="status-text">—</span></div>
      </div>
      <div class="config">
        <div class="row"><span class="title" data-i18n="sleepTitle"></span></div>
        <p class="muted small" data-i18n="sleepDesc"></p>
        <div class="seg" id="seg-sleep"></div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="configTitle"></h2>
    <div class="card">
      <div class="config">
        <div class="row"><span class="title" data-i18n="sizeTitle"></span></div>
        <p class="muted small" data-i18n="sizeDesc"></p>
        <div class="seg" id="seg-size"></div>
      </div>
      <div class="config">
        <div class="row"><span class="title" data-i18n="effortTitle"></span></div>
        <p class="muted small" data-i18n="effortDesc"></p>
        <div class="effort" id="effort">
          <div class="effort-label" id="effort-label">—</div>
          <div class="effort-model" id="effort-model">—</div>
          <div class="effort-track">
            <div class="effort-fill"><div class="sparkles" id="sparkles"></div></div>
            <div class="effort-dots"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="effort-knob"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="detailsTitle"></h2>
    <div class="card specs" id="specs"></div>
  </section>

  <section>
    <h2 data-i18n="benchTitle"></h2>
    <p class="muted" data-i18n="benchDesc"></p>
    <div id="benchmarks"></div>
    <p class="muted small" data-i18n="benchNote"></p>
  </section>

  <div class="part"><p class="eyebrow" data-i18n="partHardware"></p></div>

  <section>
    <h2 data-i18n="gpuTitle"></h2>
    <p class="muted" data-i18n="gpuDesc"></p>
    <div class="card gpu-card">
      <div class="row gpu-head">
        <div>
          <div class="gpu-name" id="gpu-name">—</div>
          <div class="muted small" id="gpu-arch">—</div>
        </div>
        <span class="gpu-status" id="gpu-status">—</span>
      </div>
      <div class="gpu-tiles" id="gpu-tiles"></div>
      <div class="gpu-runtime">
        <div class="row"><span><span data-i18n="kUtil"></span> <span class="tag" data-i18n="tagSimulated"></span></span><b id="gpu-util">—</b></div>
        <div class="bar"><div id="gpu-util-bar"></div></div>
        <div class="row small"><span class="muted"><span data-i18n="kEffective"></span> <span class="tag" data-i18n="tagSimulated"></span></span><span id="gpu-effective">—</span></div>
        <div class="row small"><span class="muted" data-i18n="kRunning"></span><span id="gpu-model">—</span></div>
        <div class="row small"><span class="muted" data-i18n="kNextGen"></span><span id="gpu-next">—</span></div>
        <p class="muted small" id="gpu-sleep-note" data-i18n="sleepNote" hidden></p>
      </div>
      <details class="gpu-details">
        <summary data-i18n="detailsSummary"></summary>
        <div class="specs" id="gpu-spec-list"></div>
        <p class="muted small" data-i18n="runtimeNote"></p>
        <p class="muted small" data-i18n="specNote"></p>
      </details>
    </div>
  </section>

  <section>
    <h2 data-i18n="tlTitle"></h2>
    <p class="muted" data-i18n="tlDesc"></p>
    <div class="timeline" id="gpu-timeline"></div>
    <div class="card" id="gpu-gen-detail"></div>
    <h3 data-i18n="compareTitle"></h3>
    <div class="table-wrap"><table class="compare" id="gpu-compare"></table></div>
  </section>

  <footer class="muted small" data-i18n="footer"></footer>
</main>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
<script src="gpu.js"></script>
<script src="share.js"></script>
</body>
</html>
