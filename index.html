<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Haonan · Usage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="lang-toggle" class="lang-toggle" type="button" data-i18n="toggle">EN</button>
<main>
  <header>
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 id="model-name">Haonan</h1>
    <p class="lede" id="lede"></p>
    <div class="pills">
      <span class="pill"><span data-i18n="size"></span> · <b id="pill-size">—</b></span>
      <span class="pill"><span data-i18n="effort"></span> · <b id="pill-effort">—</b></span>
      <span class="pill"><span data-i18n="context"></span> · <b id="pill-context">—</b></span>
    </div>
  </header>

  <section id="editor" hidden>
    <h2 data-i18n="editTitle"></h2>
    <p class="muted" data-i18n="editDesc"></p>
    <div class="card">
      <label class="slider"><span class="row"><span data-i18n="sleepLabel"></span><b id="sleep-value"></b></span>
        <input type="range" id="sleep-input" min="0" max="1" step="0.05"></label>
      <label class="slider"><span class="row"><span data-i18n="clarityLabel"></span><b id="clarity-value"></b></span>
        <input type="range" id="clarity-input" min="0" max="1" step="0.05"></label>
      <label class="slider"><span class="row"><span data-i18n="desireLabel"></span><b id="desire-value"></b></span>
        <input type="range" id="desire-input" min="0" max="1" step="0.05"></label>
      <div class="row actions">
        <span class="muted small" id="save-status"></span>
        <button type="button" class="primary" id="save-button" data-i18n="save"></button>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="limitsTitle"></h2>
    <p class="muted" data-i18n="limitsDesc"></p>
    <div class="card">
      <div class="limit">
        <div class="row"><span class="title" data-i18n="dailyLimit"></span></div>
        <div class="row muted"><span id="reset-text">—</span><span id="left-pct">—</span></div>
        <div class="bar"><div id="left-bar"></div></div>
        <div class="row muted small"><span id="left-tokens">—</span><span id="status-text">—</span></div>
      </div>
    </div>
    <p class="muted small" id="updated-text"></p>
  </section>

  <section>
    <h2 data-i18n="configTitle"></h2>
    <div class="card">
      <div class="config">
        <div class="row"><span class="title" data-i18n="sizeTitle"></span><span class="muted small" id="clarity-text">—</span></div>
        <p class="muted small" data-i18n="sizeDesc"></p>
        <div class="seg" id="seg-size"></div>
      </div>
      <div class="config">
        <div class="row"><span class="title" data-i18n="effortTitle"></span><span class="muted small" id="desire-text">—</span></div>
        <p class="muted small" data-i18n="effortDesc"></p>
        <div class="effort" id="effort">
          <div class="effort-label" id="effort-label">—</div>
          <div class="effort-model" id="effort-model">—</div>
          <div class="effort-track">
            <div class="effort-fill"><div class="sparkles" id="sparkles"></div></div>
            <div class="effort-dots"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="effort-knob"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="detailsTitle"></h2>
    <div class="card specs" id="specs"></div>
  </section>

  <section>
    <h2 data-i18n="benchTitle"></h2>
    <p class="muted" data-i18n="benchDesc"></p>
    <div id="benchmarks"></div>
    <p class="muted small" data-i18n="benchNote"></p>
  </section>

  <footer class="muted small" data-i18n="footer"></footer>
</main>
<script src="app.js"></script>
</body>
</html>
