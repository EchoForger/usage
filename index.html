<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Haonan · Usage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-actions">
  <button id="export-button" class="lang-toggle" type="button" data-i18n="export"></button>
  <button id="lang-toggle" class="lang-toggle" type="button" data-i18n="toggle">EN</button>
</div>
<main>
  <header>
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 id="model-name">Haonan</h1>
    <p class="lede" id="lede"></p>
    <div class="pills">
      <span class="pill"><span data-i18n="size"></span> · <b id="pill-size">—</b></span>
      <span class="pill"><span data-i18n="effort"></span> · <b id="pill-effort">—</b></span>
      <span class="pill"><span data-i18n="context"></span> · <b id="pill-context">—</b></span>
    </div>
  </header>

  <section>
    <h2 data-i18n="limitsTitle"></h2>
    <p class="muted" data-i18n="limitsDesc"></p>
    <div class="card">
      <div class="limit">
        <div class="row"><span class="title" data-i18n="dailyLimit"></span></div>
        <div class="row muted"><span id="reset-text">—</span><span id="left-pct">—</span></div>
        <div class="bar-hit" id="left-hit"><div class="bar"><div id="left-bar"></div></div></div>
        <div class="row muted small"><span id="left-tokens">—</span><span id="status-text">—</span></div>
      </div>
      <div class="config">
        <div class="row"><span class="title" data-i18n="sleepTitle"></span></div>
        <p class="muted small" data-i18n="sleepDesc"></p>
        <div class="seg" id="seg-sleep"></div>
      </div>
    </div>
    <p class="muted small" id="updated-text"></p>
  </section>

  <section>
    <h2 data-i18n="configTitle"></h2>
    <div class="card">
      <div class="config">
        <div class="row"><span class="title" data-i18n="sizeTitle"></span></div>
        <p class="muted small" data-i18n="sizeDesc"></p>
        <div class="seg" id="seg-size"></div>
      </div>
      <div class="config">
        <div class="row"><span class="title" data-i18n="effortTitle"></span></div>
        <p class="muted small" data-i18n="effortDesc"></p>
        <div class="effort" id="effort">
          <div class="effort-label" id="effort-label">—</div>
          <div class="effort-model" id="effort-model">—</div>
          <div class="effort-track">
            <div class="effort-fill"><div class="sparkles" id="sparkles"></div></div>
            <div class="effort-dots"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="effort-knob"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="detailsTitle"></h2>
    <div class="card specs" id="specs"></div>
  </section>

  <section>
    <h2 data-i18n="benchTitle"></h2>
    <p class="muted" data-i18n="benchDesc"></p>
    <div id="benchmarks"></div>
    <p class="muted small" data-i18n="benchNote"></p>
  </section>

  <footer class="muted small" data-i18n="footer"></footer>
</main>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
<script src="share.js"></script>
</body>
</html>
